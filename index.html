<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>1915 South DC Field App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#003B4A; --blue:#3F738D; --icy:#DBECF1; --gray:#EDEDED; --orange:#F68C2C;
  --charcoal:#363534; --dune:#F1EFEB; --clay:#802020; --sage:#91996B; --navy2:#212E41; --cloud:#E6EBF2;
  --text:#595959; --ink:#212E41; --bg:#F1EFEB; --card:#FFFFFF; --line:#E1DED8;
  --good:#3E7D4F; --goodbg:#E4F0E6; --bad:#802020; --badbg:#F6E3E3; --warn:#B86A12; --warnbg:#FCEBD8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Aptos,Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{color:var(--ink);margin:0}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 120px}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top .row{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-weight:800;letter-spacing:.02em;font-size:15px}
.brand small{display:block;font-weight:500;opacity:.75;font-size:12px;letter-spacing:0}
.top .sp{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;max-width:100%;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs .tab{white-space:nowrap;flex:0 0 auto}
@media(max-width:600px){.top .row:first-child{flex-wrap:wrap}.top .row:first-child .sp{display:none}.top .tabs{width:100%;margin-top:8px}}
.tab{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.tab.on{background:var(--orange);border-color:var(--orange);color:#fff}
.who{font-size:12px;opacity:.85;text-align:right}
.who a{color:#fff}
.demo{background:var(--orange);color:#fff;text-align:center;font-size:13px;font-weight:600;padding:6px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.card h2{font-size:18px;margin-bottom:4px}
.card h3{font-size:15px;margin-bottom:8px}
.muted{color:#8a8782;font-size:13px}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:10px 0 6px}
.in{width:100%;border:1.5px solid #CFCBC4;border-radius:10px;padding:12px;background:#fff;min-height:48px}
.in:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--icy)}
textarea.in{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.sec .grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr 1fr}}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 18px;font-weight:700;cursor:pointer;min-height:50px;background:var(--navy);color:#fff}
.btn.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.or{background:var(--orange)}
.btn.sm{min-height:38px;padding:8px 12px;font-size:14px;border-radius:10px}
.btn.ghost{background:transparent;color:var(--blue);border:0;padding:8px;min-height:auto}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid #CFCBC4;background:#fff;border-radius:999px;padding:10px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:44px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.dept{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dept button{text-align:left;background:#fff;border:1.5px solid #CFCBC4;border-radius:12px;padding:14px;cursor:pointer;min-height:72px}
.dept button b{display:block;color:var(--ink);font-size:15px}
.dept button span{font-size:12px;color:#8a8782}
.dept button.on{border-color:var(--orange);box-shadow:0 0 0 3px #FDE3CB}
.dept button .st{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.sec{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.sec>h3{display:flex;align-items:center;gap:8px}
.num{display:flex;align-items:center;gap:6px}
.num .in{text-align:center;font-weight:700;font-size:18px}
.num button{flex:0 0 44px;height:48px;border-radius:10px;border:1.5px solid #CFCBC4;background:#fff;font-size:22px;font-weight:700;color:var(--navy);cursor:pointer}
.std{border:1.5px solid #CFCBC4;border-radius:12px;padding:12px;margin:10px 0;background:#fff}
.std.ok{border-color:var(--good);background:#F6FBF7}
.std.no{border-color:var(--bad);background:#FCF6F6}
.std .q{font-weight:600;color:var(--ink)}
.std .yn{display:flex;gap:8px;margin-top:10px}
.std .yn button{flex:1;min-height:46px;border-radius:10px;border:1.5px solid #CFCBC4;background:#fff;font-weight:700;cursor:pointer}
.std .yn button.y.on{background:var(--good);border-color:var(--good);color:#fff}
.std .yn button.n.on{background:var(--bad);border-color:var(--bad);color:#fff}
.req{font-size:11px;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:.04em}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.ph{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--gray)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:24px;padding:0;cursor:pointer}
.addph{width:84px;height:84px;border-radius:10px;border:2px dashed var(--blue);background:#F7FAFB;color:var(--blue);font-weight:700;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;text-align:center}
.addph input{display:none}
.rows .r{display:grid;gap:8px;align-items:end;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#FCFBF9}
.rows .r .x{background:none;border:0;color:var(--clay);font-weight:700;cursor:pointer;padding:8px}
.rows .r .in{min-height:44px;padding:10px}
.def{font-size:12px;color:#7a7771;margin-top:4px}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--icy);border-radius:12px;padding:12px}
.tile .v{font-size:24px;font-weight:800;color:var(--navy)}
.tile .l{font-size:12px;font-weight:600;color:var(--blue)}
.tile .s{font-size:12px;margin-top:2px}
.tile.good{background:var(--goodbg)} .tile.good .v{color:var(--good)}
.tile.bad{background:var(--badbg)} .tile.bad .v{color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .row{max-width:860px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .row .msg{flex:1;font-size:13px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--goodbg);color:var(--good)}
.p-late{background:var(--warnbg);color:var(--warn)}
.p-miss{background:var(--badbg);color:var(--bad)}
.p-pend{background:var(--gray);color:#7a7771}
.p-draft{background:var(--icy);color:var(--blue)}
.p-edit{background:#EEE6F5;color:#5C3F7A}
table.board{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
table.board th{font-size:12px;text-align:left;color:var(--blue);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.board td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.board td.cell{cursor:pointer}
table.board td.cell:hover{background:#F7FAFB}
.cellm{font-size:12px;color:var(--ink);margin-top:4px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.flag{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.flag:last-child{border-bottom:0}
.flag .dot{flex:0 0 10px;height:10px;border-radius:50%;margin-top:5px;background:var(--bad)}
.flag .dot.w{background:var(--orange)}
.flag b{color:var(--ink)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(33,46,65,.55);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--bg);width:100%;max-width:860px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 40px}
@media(min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:18px;max-height:88vh}}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.kv div:nth-child(odd){color:#7a7771}
.kv div:nth-child(even){font-weight:700;color:var(--ink);text-align:right}
.light{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center}
.light img{max-width:96vw;max-height:90vh}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:70;max-width:90vw}
.center{text-align:center}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.spark{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:6px}
.help{background:var(--icy);color:#212E41;border-radius:10px;padding:8px 12px;font-size:13px;margin:0 0 12px}
.prog{height:8px;background:var(--gray);border-radius:6px;overflow:hidden;margin-top:8px}.prog i{display:block;height:8px;background:var(--orange)}
.upc{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;border-top:1px solid var(--line);padding:12px 0}
.pcard{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;background:#fff}
.pphlog td:first-child,.pphlog thead tr:first-child th:first-child{position:sticky;left:0;background:#fff;z-index:1;min-width:150px;box-shadow:1px 0 0 var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hide{display:none!important}
.hist .h{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.num .in{flex:1;min-width:0;background:#fff;border:1.5px solid #CFCBC4}
.mic{flex:0 0 44px;height:44px;border-radius:10px;border:1.5px solid #CFCBC4;background:#fff;color:var(--navy);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.mic svg{width:20px;height:20px}
.mic.on{background:var(--orange);border-color:var(--orange);color:#fff}
.micwrap{display:flex;gap:6px;align-items:center}.micwrap>.in{flex:1;min-width:0}
#fmic{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;height:48px;padding:0 16px;border-radius:24px;border:0;background:var(--navy);color:#fff;font-weight:700;display:none;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer}
#fmic.show{display:inline-flex}#fmic.on{background:var(--orange)}#fmic svg{width:20px;height:20px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   1915 South DC Field App
   Leaders file the end of day recap per department. Frank and the
   reviewers see every DC on one board. Data lives in the
   field-leader-1915 Firebase project (collections dcdays and dcphotos).
   Paste the web config from the Field Leader App below. While apiKey is
   empty the app runs in DEMO MODE and keeps everything on this device.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBGLUx4Tce6Wi22rA0xuNKtABIJUu-EauA",
  authDomain: "field-leader-1915.firebaseapp.com",
  projectId: "field-leader-1915"
};
const OWNER = "fpina@1915south.com";
const DEADLINE_HOUR = 17;          // no longer the deadline; kept for old code paths
const LATE_GRACE = 0.5;            // recap is due at the end of the leader's shift; late after 30 minutes past it
const HELD_DAYS_FLAG = 2;          // returns items held longer than this get flagged
const DIRECTOR_IN_BY = "07:00";    // Justin: the DC Director day begins no later than 7 AM
const OFF_DOCK_BY = "08:00";       // local trucks off the dock by this time
const CLEARANCE_RENT = 1000;       // $ per day the clearance center area is used for storage (Q3 rule, comes off the DC Director bonus)

const DCS = [
  {code:"9910", key:"RH", name:"Red Hills", city:"Thomasville, GA", tz:"America/New_York"},
  {code:"9912", key:"KV", name:"Kernersville", city:"Kernersville, NC", tz:"America/New_York"},
  {code:"9911", key:"LX", name:"Loxley", city:"Loxley, AL", tz:"America/Chicago"},
  {code:"9913", key:"CV", name:"Covington", city:"Covington, LA", tz:"America/Chicago"}
];

/* Markets each DC loads for. Red Hills comes from Tyler's outbound recaps.
   The others start empty and the leader adds markets as rows. */
const MARKETS = {
  "9910":["Jacksonville","Brunswick","Columbus","Macon","Dothan","Panama City","Local Red Hills"],
  "9911":[], "9912":[], "9913":[]
};

/* Numeric standards. Only rewrap has a stated standard today (4 pieces per
   person hour, from Blake). Set the others here once they are agreed. null = not set. */
const TARGETS = {
  receiving:{pph:null}, picking:{pph:null}, loading:{pph:null}, outbound:{dnlRate:null},
  rewrap:{pph:4}, shop:{pph:null}, returns:{pph:null}, delivery:{stopRate:null}
};

const DNL_REASONS = [
  ["damage","Damage","Piece found damaged at pick or load and could not go."],
  ["short","Short on inventory","System shows it, but it was not found in time: on RESEARCH, still on a DEL location off the return truck, or showing RESTK or DOCK and not located."],
  ["unreserved","Order unreserved","Order was not reserved to inventory before the route locked."],
  ["custhas","Customer has items","Guest already has the pieces."],
  ["tagged","Tagged wrong","Wrong tag or label on the product."],
  ["resched","Reschedule","Guest or store moved the delivery after the route locked."],
  ["other","Other","Anything else. Say what in the note."]
];
const VIOLATIONS=["Furniture on the floor overnight","Furniture in a traffic lane","Furniture at a stairwell","No vest on the floor","Other"];
const PR_FAIL=["Guest not home","Guest refused or changed mind","Item not ready or not as described","Ran out of time on the route","No room on the truck","Other"];
const HELD_WAITING = ["Storis","Store","Guest Solutions","Delivery support","Vendor","Other"];

/* ---------------- Department definitions ----------------
   fields: numbers or times typed by the leader
   labor: headcount + labor hours + OT hours block
   standards: yes / no checks, photo required when photo:true
   lists: repeating rows
   metrics(d): computed tiles                                   */
/* ---------- overtime watch ----------
   Hours worked this week (Paylocity, through yesterday) + hours still scheduled (DC schedule, today to Sunday).
   Anyone projected at OT_WARN or more shows up on the inbound manager, outbound manager and director checklists. */
const OT_WARN=38, OT_LIMIT=40, OT_DEPTS=["receiving","outbound","director"];
const OT_ACTIONS=["","Hours adjusted on the schedule","Sent home early","Day off moved","OT approved by director","Not fixed yet"];
const OT_NOTE_REQ=["OT approved by director","Not fixed yet"];
async function salariedSet(dc){const out=new Set();try{(await store.query([["dc","EQUAL",dc]],"dcleaders")).filter(l=>l.active!==false&&["manager","director"].includes(l.role)).forEach(l=>{out.add(nameKey(l.name));const last=String(l.name||"").trim().split(/\s+/).pop().toLowerCase();out.add("last:"+last)})}catch(e){}return out}
async function otWatch(dc,date){const SAL=await salariedSet(dc);const isSal=x=>SAL.has(nameKey(x.name))||(x.leader&&SAL.has("last:"+String(firstLast(x.name)).trim().split(/\s+/).pop().toLowerCase()))||/manag|director|delivery supervisor/i.test((x.dept||"")+" "+(x.pos||""));
  const wd=new Date(date+"T12:00:00").getDay(),mon=addDays(date,-((wd+6)%7));const days=[0,1,2,3,4,5,6].map(i=>addDays(mon,i));
  const pp=await pphGet(dc+"_people");const names={};((pp&&pp.people)||[]).forEach(x=>names[x.id]=x);
  const P={};const get=(id,o)=>P[id]=P[id]||{id,name:o.name||id,team:o.team||"",sup:o.sup||"",worked:0,sched:0,est:0};
  let paidThrough="";
  for(const d of days){
    const sc=await loadSchedule(dc,d);const sp=sc?sc.people:{};
    let act=null;if(d<date){const o=await pphGet(dc+"_ot_"+d);if(o&&o.rows){act={rows:o.rows,all:true}}else{const h=await pphGet(dc+"_hrs_"+d);if(h&&h.rows)act={rows:h.rows,all:false}}}
    if(act){paidThrough=d;Object.entries(act.rows).forEach(([id,x])=>{const nm=names[id]||{};const s2=sp[id]||{};get(id,{name:x.name||nm.name||s2.name,team:s2.team||x.dept,sup:x.sup||nm.sup||s2.sup}).worked+=act.all?n(x.h):n(x.reg)+n(x.ot)})}
    Object.values(sp).forEach(x=>{if(isSal(x))return;const q=get(x.id,x);if(!q.team)q.team=x.team;if(!q.sup)q.sup=x.sup;
      if(act&&(act.all||act.rows[x.id]))return;   // Paylocity already counted this day
      if(d<date)q.est+=x.hrs;q.sched+=x.hrs});
  }
  const list=Object.values(P).map(q=>Object.assign(q,{worked:r2(q.worked),sched:r2(q.sched),proj:r2(q.worked+q.sched)})).filter(q=>q.proj>OT_LIMIT&&!SAL.has(nameKey(q.name))).sort((a,b)=>b.proj-a.proj);
  return {mon,paidThrough,list}}
function otScope(rec,w){if(!w)return [];if(rec.dept==="director")return w.list;const last=String(S.profile.name||"").trim().split(/\s+/).pop().toLowerCase();const mine=w.list.filter(x=>String(x.sup||"").toLowerCase()===last);return mine.length?mine:w.list}
function otPrefill(rec,w){rec.lists.ot=rec.lists.ot||[];const have={};rec.lists.ot.forEach(x=>{if(x.id)have[x.id]=x});
  otScope(rec,w).forEach(q=>{const x=have[q.id];if(x){Object.assign(x,{proj:q.proj,worked:q.worked,sched:q.sched,team:q.team})}else rec.lists.ot.push({id:q.id,who:q.name,team:q.team,worked:q.worked,sched:q.sched,proj:q.proj,est:q.est,action:"",note:""})})}
function renderOt(){
  const r=S.rec,box=document.getElementById("rows_ot");if(!box)return;const rows=r.lists.ot||[];const w=S.otw;
  const opts=(id,v)=>'<select class="in" id="'+id+'">'+OT_ACTIONS.map(o=>'<option value="'+esc(o)+'"'+(v===o?' selected':'')+(o?'':' disabled')+'>'+(o||'Pick what you did')+'</option>').join("")+'</select>';
  box.innerHTML='<div class="def" style="margin:0 0 8px">Pull up this week in Paylocity. Anyone on pace for more than '+OT_LIMIT+' hours shows here: hours worked'+(w&&w.paidThrough?' through '+md(w.paidThrough):'')+' plus what the DC schedule still has them on for. Adjust the schedule so nobody goes over '+OT_LIMIT+' unless the director approved it.</div>'+
   (rows.length?'':'<div class="def" style="color:var(--good);font-weight:700">Nobody on pace for overtime this week.</div>')+
   rows.map((x,i)=>{const over=n(x.proj)>OT_LIMIT;const ok=x.action&&x.action!=="Not fixed yet";
    return '<div class="std'+(ok?' ok':x.action==="Not fixed yet"?' no':'')+'" style="margin-bottom:8px">'+
     (x.id?'<div class="q">'+esc(x.who)+(x.team?' <span class="muted">'+esc(x.team)+'</span>':'')+'</div><div class="def" style="margin:2px 0 0"><b style="color:'+(over?'var(--clay)':'var(--ink)')+'">'+n(x.proj)+' hrs projected</b> &middot; '+n(x.worked)+' worked + '+n(x.sched)+' still scheduled'+(n(x.est)?' (Paylocity not in for some days, schedule used)':'')+'</div>'
      :'<div style="display:grid;grid-template-columns:1fr 110px;gap:8px"><input class="in" id="ot_'+i+'_who" value="'+esc(x.who)+'" placeholder="Name"><input class="in" id="ot_'+i+'_proj" inputmode="decimal" value="'+esc(x.proj)+'" placeholder="Hours"></div>')+
     '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:8px">'+opts('ot_'+i+'_action',x.action)+
     '<input class="in" id="ot_'+i+'_note" value="'+esc(x.note)+'" placeholder="'+(OT_NOTE_REQ.includes(x.action)?(x.action==="Not fixed yet"?'Why, and when it gets fixed (required)':'Who approved and why (required)'):'What changed, for example off Friday')+'"></div>'+
     (x.id?'':'<button class="x" data-otrm="'+i+'">Remove</button>')+'</div>'}).join("");
  rows.forEach((x,i)=>["who","proj","action","note"].forEach(k=>{const el=document.getElementById('ot_'+i+'_'+k);if(el)el.oninput=el.onchange=()=>{x[k]=el.value;saveDraft();renderBar();if(k==="action")renderOt()}}));
  box.querySelectorAll("[data-otrm]").forEach(b=>b.onclick=()=>{rows.splice(+b.dataset.otrm,1);renderOt();saveDraft();renderBar()});
  const c=document.getElementById("cnt_ot");if(c)c.textContent=rows.length}

 {k:"receiving", name:"Receiving", who:"Inbound", labor:true,

/* ---------------- small helpers ---------------- */
function n(v){const x=parseFloat(v);return isFinite(x)?x:0}
function fmt(v){return v===""||v==null?"--":String(v)}
function frac(a,b){return (a===""||a==null)&&(b===""||b==null)?"--":fmt(a)+" of "+fmt(b)}
function pct(a,b){return n(b)>0?Math.round(n(a)/n(b)*100)+"%":"--"}
function pph(pieces,d,dept){
  const hrs=n(d.laborHours); const t=TARGETS[dept]&&TARGETS[dept].pph;
  const v=hrs>0?n(pieces)/hrs:null;
  return {l:"Pieces per labor hour",v:v==null?"--":v.toFixed(1),s:t==null?"Standard not set":"Standard "+t,bad:t!=null&&v!=null&&v<t,good:t!=null&&v!=null&&v>=t,key:"pph",raw:v};
}
function time12(t){if(!t)return"";const[h,m]=t.split(":").map(Number);return ((h%12)||12)+":"+String(m).padStart(2,"0")+(h<12?"am":"pm")}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function todayISO(tz){const p=new Intl.DateTimeFormat("en-CA",{timeZone:tz||"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());return p}
function addDays(iso,k){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+k);return d.toISOString().slice(0,10)}
function daysSince(iso,ref){if(!iso)return 0;return Math.round((new Date((ref||todayISO())+"T12:00:00")-new Date(iso+"T12:00:00"))/864e5)}
function localHour(tz,date){const d=date?new Date(date):new Date();const p=new Intl.DateTimeFormat("en-US",{timeZone:tz,hour:"numeric",minute:"numeric",hour12:false}).formatToParts(d);const h=+p.find(x=>x.type==="hour").value%24,m=+p.find(x=>x.type==="minute").value;return h+m/60}
function localDate(tz,date){return new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(date))}
function niceDate(iso){return new Date(iso+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}
function niceTime(ts,tz){return new Date(ts).toLocaleTimeString("en-US",{timeZone:tz,hour:"numeric",minute:"2-digit"})}
function dcBy(code){return DCS.find(x=>x.code===code)}
function recId(dc,date,dept,shift){return dc+"_"+date+"_"+dept+"_"+shift}
function ls(k,v){try{if(v===undefined){const x=localStorage.getItem("dcf_"+k);return x?JSON.parse(x):null}localStorage.setItem("dcf_"+k,JSON.stringify(v))}catch(e){return null}}
function help(t){return '<div class="help">'+t+'</div>'}
function toast(m){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ---------------- IndexedDB (drafts + demo storage) ---------------- */
const memDB={};const idbMem={get:async(s,k)=>((memDB[s]||{})[k]||null),put:async(s,k,v)=>{(memDB[s]=memDB[s]||{})[k]=JSON.parse(JSON.stringify(v))},del:async(s,k)=>{if(memDB[s])delete memDB[s][k]},all:async s=>Object.values(memDB[s]||{})};
const idb={db:null,
  open(){return new Promise(res=>{if(this.db)return res(this.db);let r;try{r=indexedDB.open("dcfield",13)}catch(e){return res(null)}
    r.onupgradeneeded=()=>{const d=r.result;["drafts","photos","records","issues","bonus","bonuspay","hourly","hourlydc","volume","budget","pph","missed","drivers","uploads","schedule","leaders","team","teamlogin","teamuid","public","reviews","mine","flags","huddles","dcgoals"].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s)})};
    r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>res(null)})},
  async get(s,k){const d=await this.open();if(!d)return idbMem.get(s,k);return new Promise(res=>{const q=d.transaction(s).objectStore(s).get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})},
  async put(s,k,v){const d=await this.open();if(!d)return idbMem.put(s,k,v);return new Promise(res=>{const t=d.transaction(s,"readwrite");t.objectStore(s).put(v,k);t.oncomplete=()=>res();t.onerror=()=>res()})},
  async del(s,k){const d=await this.open();if(!d)return idbMem.del(s,k);return new Promise(res=>{const t=d.transaction(s,"readwrite");t.objectStore(s).delete(k);t.oncomplete=()=>res();t.onerror=()=>res()})},
  async all(s){const d=await this.open();if(!d)return idbMem.all(s);return new Promise(res=>{const q=d.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}
};

/* a leader is "listed" when Frank or a director has added them (Team tab), or they are on the Field Leader or DC Scheduler access lists */
async function listedLeader(email){email=String(email||"").toLowerCase();for(const c of ["dcleaders","users","dcAccess"]){try{const r=await fsReq("GET","/"+c+"/"+encodeURIComponent(email));if(r)return true}catch(e){}}return false}
const AUTH_URL="https://identitytoolkit.googleapis.com/v1/accounts:";
const FS_BASE=()=>"https://firestore.googleapis.com/v1/projects/"+FIREBASE_CONFIG.projectId+"/databases/(default)/documents";
const auth={
  s:ls("auth"),
  async call(ep,body){const r=await fetch(AUTH_URL+ep+"?key="+FIREBASE_CONFIG.apiKey,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(authMsg(j.error&&j.error.message));return j},
  save(j,email){const old=this.s||{};this.s={email:(email||j.email).toLowerCase(),idToken:j.idToken||j.id_token,refreshToken:j.refreshToken||j.refresh_token,exp:Date.now()+((+(j.expiresIn||j.expires_in))-60)*1000,verified:old.verified,uid:j.localId||j.user_id||old.uid,team:old.team};ls("auth",this.s)},
  async signIn(email,pw){const j=await this.call("signInWithPassword",{email,password:pw,returnSecureToken:true});this.save(j,email);await this.checkVerified();return this.s},
  async signUp(email,pw){const j=await this.call("signUp",{email,password:pw,returnSecureToken:true});this.save(j,email);
    // leaders already on a list (Team tab, Field Leader users, DC Scheduler) get in without an email; anyone else verifies
    if(await listedLeader(email)){this.s.verified=true;ls("auth",this.s)}else await this.call("sendOobCode",{requestType:"VERIFY_EMAIL",idToken:j.idToken});return this.s},
  async resendVerify(){await this.call("sendOobCode",{requestType:"VERIFY_EMAIL",idToken:await this.token()})},
  async reset(email){await this.call("sendOobCode",{requestType:"PASSWORD_RESET",email})},
  async checkVerified(){const j=await this.call("lookup",{idToken:await this.token()});this.s.verified=!!(j.users&&j.users[0]&&j.users[0].emailVerified)||await listedLeader(this.s.email);ls("auth",this.s);return this.s.verified},
  async token(){if(!this.s)throw new Error("Signed out");if(Date.now()<this.s.exp)return this.s.idToken;
    const r=await fetch("https://securetoken.googleapis.com/v1/token?key="+FIREBASE_CONFIG.apiKey,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(this.s.refreshToken)});
    const j=await r.json();if(!r.ok){this.out();throw new Error("Please sign in again")}this.save(j,this.s.email);return this.s.idToken},
  out(){this.s=null;ls("auth",null)}

async function pphImport(file,P){

    opt("date","Date")+opt("id","Employee ID")+opt("name","Name")+opt("last","Last name (if split)")+opt("first","First name (if split)")+opt("dept","Department")+opt("sup","Supervisor")+opt("reg","Regular hours")+opt("ot","OT hours")+opt("pto","PTO / non-work hours")+opt("hours","Hours (one column)")+opt("code","Earnings code (with Hours)")+
    '</div><label class="lbl">If the file has no Date column, these hours are for</label><input class="in" type="date" id="pp_fd" value="'+P.date+'"><div style="height:12px"></div><button class="btn or wide" id="pp_go">Load hours for '+esc(dcBy(P.dc).name)+'</button><div style="height:8px"></div><button class="btn ghost wide" data-close>Cancel</button>');
  m.querySelector("#pp_go").onclick=async()=>{
    m.querySelectorAll("[data-m]").forEach(s=>M[s.dataset.m]=+s.value);
    if(M.id<0&&M.name<0&&M.last<0)return toast("Pick the Employee ID or Name column");
    const g=(r,i)=>i>=0?String(r[i]||"").trim():"";const fd=m.querySelector("#pp_fd").value;
    const byDay={},ppl={},allDay={};let skipped=0;const old0=await pphGet(P.dc+"_people");const known=(old0&&old0.people)||[];
    rows.slice(1).forEach(r=>{const name=g(r,M.name)||(g(r,M.last)?g(r,M.last)+", "+g(r,M.first):"");const emp=g(r,M.id);
      const hit=(emp&&known.find(p=>p.emp===emp))||(name&&known.find(p=>p.id===nameKey(name)));const id=hit?hit.id:(nameKey(name)||emp);if(!id)return;
      {const dt=M.date>=0?normDate(g(r,M.date)):fd;if(/^\d{4}-\d{2}-\d{2}$/.test(dt||"")){const a=((allDay[dt]=allDay[dt]||{})[id]=allDay[dt][id]||{name:name||id,dept:g(r,M.dept),sup:g(r,M.sup).split(",")[0].trim(),h:0});
        if(M.hours>=0){if(!/pto|vac|hol|sick|bereav|jury|non/.test(g(r,M.code).toLowerCase()))a.h=r2(a.h+n(g(r,M.hours)))}else a.h=r2(a.h+n(g(r,M.reg))+n(g(r,M.ot)))}}
      const dept=M.dept>=0?pphDeptOf(g(r,M.dept)):"4";if(!dept){skipped++;return}
      const date=M.date>=0?normDate(g(r,M.date)):fd;if(!/^\d{4}-\d{2}-\d{2}$/.test(date||"")){skipped++;return}
      const prev=ppl[id]||hit||{};ppl[id]=Object.assign({},prev,{id,emp:emp||prev.emp||"",name:prev.name||name||id,dept:prev.dept||dept,sup:g(r,M.sup).split(",")[0].trim()||prev.sup||""});
      const x=((byDay[date]=byDay[date]||{})[id]=byDay[date][id]||{reg:0,ot:0,pto:0});
      if(M.hours>=0){const hh=n(g(r,M.hours));const c=g(r,M.code).toLowerCase();if(/ot|overtime/.test(c))x.ot+=hh;else if(/pto|vac|hol|sick|bereav|jury|non/.test(c))x.pto+=hh;else x.reg+=hh}

/* ---------- DC roster (Active Roster export) ----------
   One file for all DCs: Last Name, First Name, Work Location, Supervisor, Position, Department.
   Keeps Dept 4 Warehouse and Dept 5 Technicians. Sets who shows on the PPH tracker for each DC. */
async function pphRosterImport(file,P){
  const rows=parseCSV(await file.text());if(rows.length<2)return toast("That file looks empty");
  const lo=rows[0].map(h=>h.trim().toLowerCase());const f=re=>lo.findIndex(h=>re.test(h));
  const M={last:f(/^last/),first:f(/^first/),name:f(/^name$|employee name/),loc:f(/location/),sup:f(/supervisor/),pos:f(/position|title/),dept:f(/department/),email:f(/email/)};
  if(M.loc<0||M.dept<0||(M.last<0&&M.name<0))return toast("Need Last Name, First Name, Work Location and Department columns");
  const g=(r,i)=>i>=0?String(r[i]||"").trim():"";const by={};let kept=0;
  rows.slice(1).forEach(r=>{const dept=pphDeptOf(g(r,M.dept).split("-")[0]);if(!dept)return;const dc=dcFromName(g(r,M.loc));if(!dc)return;
    const name=M.last>=0?g(r,M.last)+", "+g(r,M.first):g(r,M.name);const id=nameKey(name);if(!id)return;
    (by[dc.code]=by[dc.code]||[]).push({id,name,dept,sup:g(r,M.sup).split(",")[0].trim(),pos:g(r,M.pos),email:g(r,M.email).toLowerCase()});kept++});
  try{for(const code of Object.keys(by)){const old=await pphGet(code+"_people");const prev={};((old&&old.people)||[]).forEach(p=>prev[p.id]=p);
      const list=by[code].map(p=>Object.assign({},prev[p.id]||{},p,{emp:(prev[p.id]||{}).emp||""})).sort((a,b)=>a.name.localeCompare(b.name));
      await store.set("dcpph",code+"_people",{dc:code,kind:"people",people:list,updatedBy:S.profile.email,updatedAt:new Date().toISOString()})}
    upMeta("roster",todayISO(),kept+" associates across "+Object.keys(by).length+" DCs");
    toast("Roster loaded: "+kept+" associates across "+Object.keys(by).length+" DCs");if(P.after)P.after();else renderPPH()}catch(e){toast("Did not save: "+e.message)}
}

/* ---------- returns from the last delivery day ----------
   The issue file is the delivery returns report: every row is merchandise that came back off a truck.
   Returns checked in today come from the previous delivery day (Monday picks up Saturday).
   Orders ending in "e" are exchanges: the old piece comes back, so they count (shown as exchange pieces).
   Other negative rows are credits with nothing coming back, and service calls are left out. */
function prevDelivDay(iso){let d=addDays(iso,-1);for(let i=0;i<7&&!isDelivDay(d);i++)d=addDays(d,-1);return d}
function retFromIssues(doc,pd){if(!doc)return {date:pd,none:true};
  const isEx=x=>/e$/i.test(String(x.order));const rows=(doc.rows||[]).filter(x=>!x.service&&(isEx(x)||n(x.value)>=0));const pc=x=>n(x.lines)||1;
  const byResp={};rows.forEach(x=>byResp[x.resp||"Other"]=(byResp[x.resp||"Other"]||0)+pc(x));
  return {date:doc.date||pd,rows,orders:new Set(rows.map(x=>String(x.order).replace(/e$/i,""))).size,pcs:rows.reduce((a,x)=>a+pc(x),0),
    dcPcs:rows.filter(x=>/^dc/i.test(x.resp)).reduce((a,x)=>a+pc(x),0),exPcs:rows.filter(isEx).reduce((a,x)=>a+pc(x),0),value:rows.reduce((a,x)=>a+Math.abs(n(x.value)),0),byResp}}
async function loadRet(dc,date){const pd=prevDelivDay(date);try{return retFromIssues(await store.get("dcissues",dc+"_"+pd),pd)}catch(e){return {date:pd,none:true,err:e.message}}}
function retPanelHTML(ret,checked,who){
  if(!ret)return "";const day=niceDate(ret.date);
  if(ret.none)return '<div class="sec"><h3>Delivery returns report</h3><div class="def">No returns report loaded for '+day+' deliveries yet'+(ret.err?' ('+esc(ret.err)+')':'')+'. It comes from the issue file uploaded on the DC board.</div></div>';
  const gap=checked==null||checked===""?null:n(checked)-ret.pcs;
  return '<div class="sec"><h3>Coming back from '+day+' deliveries</h3><div class="metrics">'+tilesHTML([
     {l:"Pieces on the report",v:String(ret.pcs),s:ret.orders+" orders, "+usd(ret.value)+(ret.exPcs?". "+ret.exPcs+" from exchanges":"")},
     {l:"DC controllable",v:String(ret.dcPcs),s:"pieces",bad:ret.dcPcs>0},
     {l:(who||"Checked in"),v:checked==null||checked===""?"--":fmt(checked),s:gap==null?"":gap===0?"Matches the report":(gap<0?Math.abs(gap)+" short of":gap+" over")+" the report",bad:gap!=null&&gap!==0,good:gap===0}])+'</div>'+
   '<div class="def">'+Object.entries(ret.byResp).sort((a,b)=>b[1]-a[1]).map(([k,v])=>esc(k)+' '+v).join(" &middot; ")+'</div>'+
   '<details style="margin-top:6px"><summary class="muted" style="cursor:pointer">Orders on the report ('+ret.rows.length+')</summary>'+
   ret.rows.map(x=>'<div class="def">'+esc(x.order)+(/e$/i.test(String(x.order))?' <b>(exchange)</b>':'')+' &middot; '+esc(reasonParts(x.reason).label)+' &middot; '+(n(x.lines)||1)+' pc &middot; '+esc(x.resp)+(x.driver?' &middot; '+esc(x.driver):'')+'</div>').join("")+'</details></div>'}

function blankRec(){
  const d=DEPT[S.dept];const rec={dc:S.dc,date:S.date,dept:S.dept,shift:S.shift,email:S.profile.email,leader:S.profile.name||S.profile.email,
    status:"draft",data:{},standards:{},lists:{},notes:"",photos:{},edits:[],editedAfterSubmit:false};
  stdFor(S.dept,S.dc,S.skipStd).forEach(s=>rec.standards[s[0]]={ok:null,note:""});
  d.lists.forEach(l=>rec.lists[l[0]]=[]);
  if(S.dept==="director")rec.lists.iwye=iwyeAreasFor(S.dc).map(a=>({area:a,result:"",matches:"Yes",note:""}));
  if(S.dept==="outbound")rec.lists.markets=(MARKETS[S.dc]||[]).map(m=>({market:m,trucks:""}));
  return rec;
}
async function openRecord(){

    const done=await Promise.all(days.map(async d=>{try{const pr=await store.get("dcdays",recId(S.dc,d,"director",S.shift));return pr&&pr.status==="submitted"&&(pr.standards||{}).extinguishers&&pr.standards.extinguishers.ok===true}catch(e){return false}}));
    if(done.some(Boolean))S.skipStd=["extinguishers"]}
  let ex=null;try{ex=await store.get("dcdays",id)}catch(e){toast(e.message)}

  }else{S.rec=blankRec();
    if(S.dept==="director"){for(let i=1;i<=3;i++){let pr=null;try{pr=await store.get("dcdays",recId(S.dc,addDays(S.date,-i),"director",S.shift))}catch(e){}
      if(pr){const lists=pr.lists||{};S.rec.lists.carry=(lists.iwye||[]).filter(x=>x.result==="Needs follow-up").map(x=>({area:x.area,note:x.note||"",status:"Not done yet"})).concat((lists.carry||[]).filter(x=>x.status!=="Done"));break}}}}

  if(S.dept==="director"&&S.rec&&S.rec.standards&&S.rec.standards.huddle&&S.rec.standards.huddle.ok==null){try{const hs=await store.query([["dc","EQUAL",S.dc],["date","EQUAL",S.date]],"dchuddles");if(hs.length){S.rec.standards.huddle={ok:true,note:"",auto:"Logged in the app: "+hs.map(x=>x.leader+" ("+(x.present||[]).length+(x.crew?" of "+x.crew:"")+" there)").join(", ")};S.rec._hudAuto=S.rec.standards.huddle.auto}}catch(e){}}
  if(S.dept==="returns"||S.dept==="director"){S.ret=await loadRet(S.dc,S.date);
    if(S.dept==="director"){try{const rr=await store.get("dcdays",recId(S.dc,S.date,"returns",S.shift));S.retChecked=rr&&rr.status==="submitted"?(rr.data||{}).returned:null}catch(e){}}}
  // enter PPH once: pieces, labor hours and headcount come from the PPH log when it has that job
  // shop: pieces by tech and bucket come from the Technicians PPH log
  if(S.dept==="shop"&&S.rec&&!(S.existing&&S.existing.status==="submitted")){try{const lg=await store.get("dcpph",S.dc+"_log_"+S.date);const pp=await pphGet(S.dc+"_people");const hr=await pphGet(S.dc+"_hrs_"+S.date);const sc=await loadSchedule(S.dc,S.date);
    if(lg&&lg.rows){const names={};((pp&&pp.people)||[]).forEach(x=>names[x.id]=x);const tech=pphDeptBy("5");const rows=[];let hh=0;
      Object.entries(lg.rows).forEach(([id,row])=>{if(!tech.jobs.some(j=>n((row[j.k]||{}).u)))return;const nm=names[id]||{};if(nm.dept&&nm.dept!=="5")return;
        const o={tech:nm.name||((sc&&sc.people[id])||{}).name||id};tech.jobs.forEach(j=>o[j.mk]=String(n((row[j.k]||{}).u)));rows.push(o);hh+=pphWorked(((hr&&hr.rows)||{})[id])||n(row._h)});

  {const map={picking:["pick","picked"],rewrap:["rewrap","wrapped"],receiving:["put","piecesRecv"],returns:["disp","returned"]}[S.dept];
   if(map&&S.rec&&!(S.existing&&S.existing.status==="submitted")){try{const lg=await store.get("dcpph",S.dc+"_log_"+S.date);if(lg&&lg.rows){let u=0,h=0,hc=0;Object.values(lg.rows).forEach(row=>{const x=row[map[0]];if(x&&(n(x.h)||n(x.u))){u+=n(x.u);h+=n(x.h);hc++}});

function trendHTML(dcs){
  const days=[];for(let i=6;i>=0;i--)days.push(addDays(S.bDate,-i));
  const inDc=r=>dcs.some(d=>d.code===r.dc);
  const series=(fn)=>days.map(dt=>fn(S.bTrend.filter(r=>r.date===dt&&inDc(r))));
  const dnlS=series(rs=>rs.filter(r=>r.dept==="outbound").reduce((a,r)=>a+(r.lists.dnl||[]).length,0));
  const nilS=series(rs=>rs.filter(r=>r.dept==="picking").reduce((a,r)=>a+(r.lists.nil||[]).length,0));
  const avgP=dept=>series(rs=>{const x=rs.filter(r=>r.dept===dept&&r.pph!=null);return x.length?x.reduce((a,r)=>a+r.pph,0)/x.length:null});
  const missS=series(rs=>DEPTS.length*dcs.length-rs.length);
  const bars=(vals,color,label)=>{const W=320,H=110,pad=18,max=Math.max(1,...vals.map(v=>v||0));const bw=(W-pad*2)/vals.length;
    return '<div><div class="lbl" style="margin-top:4px">'+label+'</div><svg class="spark" viewBox="0 0 '+W+' '+(H+18)+'">'+vals.map((v,i)=>{const h=(v||0)/max*(H-16);const x=pad+i*bw+4;return '<rect x="'+x+'" y="'+(H-h)+'" width="'+(bw-8)+'" height="'+h+'" rx="3" fill="'+color+'"/><text x="'+(x+(bw-8)/2)+'" y="'+(H-h-4)+'" font-size="11" text-anchor="middle" fill="#363534" font-weight="700">'+(v||0)+'</text><text x="'+(x+(bw-8)/2)+'" y="'+(H+14)+'" font-size="10" text-anchor="middle" fill="#8a8782">'+niceDate(days[i]).split(",")[0]+'</text>'}).join("")+'<line x1="'+pad+'" x2="'+(W-pad)+'" y1="'+H+'" y2="'+H+'" stroke="#CFCBC4"/></svg></div>'};
  const line=(sets,label,std)=>{const W=320,H=110,pad=22;const all=sets.flatMap(s=>s.v).filter(v=>v!=null).concat(std?[std]:[]);const max=Math.max(1,...all)*1.15;const sx=i=>pad+i*(W-pad*2)/6,sy=v=>H-(v/max)*(H-10);
    let svg='<svg class="spark" viewBox="0 0 '+W+' '+(H+18)+'"><line x1="'+pad+'" x2="'+(W-pad)+'" y1="'+H+'" y2="'+H+'" stroke="#CFCBC4"/>';
    if(std)svg+='<line x1="'+pad+'" x2="'+(W-pad)+'" y1="'+sy(std)+'" y2="'+sy(std)+'" stroke="#F68C2C" stroke-dasharray="4 4"/><text x="'+(W-pad)+'" y="'+(sy(std)-4)+'" font-size="10" text-anchor="end" fill="#B86A12">standard '+std+'</text>';
    sets.forEach(s=>{const pts=s.v.map((v,i)=>v==null?null:[sx(i),sy(v)]);let d="";pts.forEach(p=>{if(p)d+=(d?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)});if(d)svg+='<path d="'+d+'" fill="none" stroke="'+s.c+'" stroke-width="2.5"/>';pts.forEach((p,i)=>{if(p)svg+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.5" fill="'+s.c+'"/>'})});
    days.forEach((dt,i)=>svg+='<text x="'+sx(i)+'" y="'+(H+14)+'" font-size="10" text-anchor="middle" fill="#8a8782">'+niceDate(dt).split(",")[0]+'</text>');
    return '<div><div class="lbl" style="margin-top:4px">'+label+'</div>'+svg+'</svg><div class="legend">'+sets.map(s=>'<span><i style="background:'+s.c+'"></i>'+s.n+'</span>').join("")+'</div></div>'};
  return '<div class="card"><h3>Last 7 days'+(dcs.length===1?": "+dcs[0].name:": all DCs")+'</h3><div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">'+
    bars(dnlS,"#003B4A","DNL orders")+bars(nilS,"#3F738D","NIL items")+
    line([{n:"Rewrap",c:"#003B4A",v:avgP("rewrap")}],"Rewrap pieces per labor hour",TARGETS.rewrap.pph)+
    line([{n:"Receiving",c:"#003B4A",v:avgP("receiving")},{n:"Picking",c:"#3F738D",v:avgP("picking")},{n:"Shop",c:"#91996B",v:avgP("shop")}],"Pieces per labor hour",null)+
    bars(missS,"#802020","Recaps not filed (out of "+DEPTS.length*dcs.length+" a day)")+
  '</div></div>';
}

    for(const x of (D.rows||[]).filter(r=>r.dc===d.code&&!r.service)){const t=by[nameKey(x.driver)];if(!t)continue;
      const isLoader=/load/i.test(t.team||t.dept||"");const tier=tierOf(isLoader?LDR_TIERS:DRV_TIERS,x.rate);const tt=isLoader?LDR_TIERS:DRV_TIERS;const nx=tt.slice().reverse().find(([a])=>x.rate!=null&&x.rate<a);
      try{await store.set("dcmine",t.uid+"_standing",{uid:t.uid,emp:t.emp,kind:"standing",from:D.from,to:D.to,stops:x.stops,rate:x.rate,ontime:x.ontime,tier,msg:(tier?"You are at the $"+tier+"/hr tier. ":"Not at a tier yet. ")+(nx?"Hit "+nx[0]+"% delivered for $"+nx[1]+"/hr.":"Top tier. Keep it there."),at:new Date().toISOString()})}catch(e){}}}}

/* ---------- roster for a DC: PPH people + DC schedule + turned-on team ---------- */
async function rosterFor(code,month){
  const out={};const add=(id,o)=>{if(!id)return;out[id]=Object.assign(out[id]||{id},Object.fromEntries(Object.entries(o).filter(([k,v])=>v!==""&&v!=null)))};
  try{const pp=await pphGet(code+"_people");((pp&&pp.people)||[]).forEach(p=>add(p.id,{name:p.name,emp:p.emp,sup:p.sup,team:(pphDeptBy(p.dept)||{}).name||""}))}catch(e){}
  const m=month||todayISO().slice(0,7);const start=m+"-01";
  for(let i=0;i<5;i++){const d=addDays(start,i*7);if(d.slice(0,7)!==m&&i)break;try{const sc=await loadSchedule(code,d);if(sc)Object.values(sc.people).forEach(x=>{if(x.leader||/manag|director/i.test(x.dept||""))return;add(x.id,{name:x.name,emp:x.emp,sup:x.sup,team:x.team})})}catch(e){}}
  (await teamForAll(code)).forEach(t=>{const id=nameKey(t.name);add(id,{name:t.name,emp:t.emp,sup:t.sup,team:t.team});out[id].acct=t});
  return Object.values(out).filter(x=>x.name).sort((a,b)=>String(a.team||"").localeCompare(String(b.team||""))||a.name.localeCompare(b.name))}
async function teamForAll(code){try{return await store.query([["dc","EQUAL",code]],"dcteam")}catch(e){return []}}

/* ---------- monthly reviews ---------- */
/* ---------- monthly reviews: everyone up to the DC director ----------
   Levels: team (hourly), supervisor, manager, director.
   Who writes: team <- any leader (their supervisor), supervisor <- manager or director, manager <- director, director <- Frank.
   Approval: team reviews need a manager or director; supervisor reviews written by a manager need a director.
   Everything else goes straight to the person once submitted.
   Every review reads in this order: what you're doing well, our goal, opportunities, how we'll support you,
   and it ends by asking the person what they need from us. The app writes a suggested review from the numbers;
   the leader reads it and makes it theirs. */
const RV_AREAS=[["safety","Safety","Vest on, equipment used right, reports hazards, no shortcuts"],["quality","Quality","Right piece, no damage, follows the standard the first time"],["productivity","Productivity","Pieces per hour and stops against the goal"],["attendance","Attendance and reliability","On time, works the schedule, no call-outs"],["teamwork","Teamwork and attitude","Helps others, takes coaching, brings energy"]];
const RV_AREAS_L=[["safety","Safety","Runs a safe floor: walks it, fixes hazards, models the standard"],["quality","Standards","Their areas meet the standard and the recap is honest about it"],["productivity","Results","Team PPH, trucks on time, DNLs and issues against the goal"],["attendance","Reliability","Recap in by end of shift, follow-ups closed, there when it matters"],["teamwork","Leadership","Coaches, recognizes, holds people accountable, builds the team"]];
const rvAreas=lv=>lv&&lv!=="team"?RV_AREAS_L:RV_AREAS;
const RV_SCALE=[[1,"Needs to improve"],[2,"Getting there"],[3,"Meets the standard"],[4,"Goes above"]];
const RV_STATUS={draft:["Draft","p-draft"],submitted:["Waiting on approval","p-pend"],changes:["Sent back","p-miss"],approved:["Done","p-ok"]};
const RV_LEVEL={team:"Team member",supervisor:"Supervisor",manager:"Manager",director:"DC director"};
const RV_TEXT=[["well","What you're doing well","Start here. Name the thing they did and when."],["goal","Our goal","Where we're headed as a DC, and their one goal for next month."],["improve","Opportunities to improve","One or two things. Say what good looks like."],["support","How we'll support you","What you and the team will do to help them get there."]];
const RV_DUE_DAY=10;   // a month's reviews are due by the 10th of the next month
const rvDue=mo=>{const [y,m]=mo.split("-").map(Number);const d=new Date(y,m,RV_DUE_DAY);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(RV_DUE_DAY).padStart(2,"0")};
const rvBucket=d=>!d?"none":d.status==="approved"?(d.ack?"ack":"approved"):d.status;
const prevMonth=iso=>{const [y,m]=iso.split("-").map(Number);const d=new Date(y,m-2,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const monthLabel=m=>new Date(m+"-15T12:00:00").toLocaleDateString("en-US",{month:"long",year:"numeric"});
const myRole=p=>p.reviewer&&!p.fullOnly?"exec":(p.assign&&p.assign.role)||"supervisor";
function rvCanWrite(p,r){const me=myRole(p);if(r.email&&r.email===p.email)return false;
  if(r.level==="team"||!r.level)return true;if(r.level==="supervisor")return ["manager","director","exec"].includes(me);if(r.level==="manager")return ["director","exec"].includes(me);return me==="exec"}
function rvNeedsApproval(R,writerRole){if(R.level==="team")return !["manager","director","exec"].includes(writerRole);if(R.level==="supervisor")return writerRole==="manager";return false}
function rvCanApprove(p,R){const me=myRole(p);if(R.level==="supervisor")return ["director","exec"].includes(me);return ["manager","director","exec"].includes(me)}
const rvLevelsFor=p=>{const me=myRole(p);return me==="exec"?null:me==="director"?["team","supervisor","manager"]:me==="manager"?["team","supervisor"]:["team"]};
async function rvQuery(where){const lv=rvLevelsFor(S.profile);try{return await store.query(lv?where.concat([["level","IN",lv]]):where,"dcreviews")}catch(e){return []}}
const mineId=(r,mo)=>r.level&&r.level!=="team"?r.email+"_review_"+mo:(r.acct&&r.acct.uid?r.acct.uid+"_review_"+mo:null);

/* roster for reviews: team members plus the DC's leaders */
async function reviewRoster(code,mo){const team=(await rosterFor(code,mo)).map(r=>Object.assign(r,{level:"team"}));
  let leaders=[];try{leaders=(await store.query([["dc","EQUAL",code]],"dcleaders")).filter(l=>l.active!==false)}catch(e){}
  return team.concat(leaders.map(l=>({id:"L:"+l.email,email:l.email,name:l.name||l.email,team:RV_LEVEL[l.role]||"Leader",sup:"",level:l.role||"supervisor",depts:l.depts||[]})))}
/* acknowledgments and asks come back from the person's copy */
async function syncAcks(roster,docs){const by={};roster.forEach(r=>by[r.id]=r);
  await Promise.all(docs.filter(d=>d.status==="approved"&&d.docId).map(async d=>{const r=by[d.pid];const id=r&&mineId(r,d.month);if(!id)return;
    try{const c=await store.get("dcmine",id);if(c&&(c.ack&&!d.ack||(c.need||"")!==(d.need||""))){Object.assign(d,{ack:!!c.ack,ackAt:c.ackAt||"",ackNote:c.ackNote||"",need:c.need||""});await store.set("dcreviews",d.docId,d)}}catch(e){}}))}

function suggestReview(R,hist){
  const S2=(R.scorecard||{}).items||[];const get=k=>S2.filter(x=>x.k===k);const first=firstLast(R.name).split(" ")[0]||"you";const dc=dcBy(R.dc).name;const lead=R.level&&R.level!=="team";

      if(r>=1){well.push("Your "+(x.job==="shop"?"shop":x.job.toLowerCase())+" pace was "+x.v.toFixed(1)+" pieces an hour, "+(r>=1.1?"well ":"")+"above our "+x.goal+" goal.");rt.productivity=Math.max(rt.productivity,r>=1.1?4:3)}
      else{opp.push("Your "+(x.job==="shop"?"shop":x.job.toLowerCase())+" pace was "+x.v.toFixed(1)+" pieces an hour against our "+x.goal+" goal.");rt.productivity=Math.min(rt.productivity,r>=0.9?2:1);sup.push("Your supervisor will work part of a shift with you to find what is slowing you down.");if(!goal)goal="Hit "+x.goal+" pieces an hour on "+(x.job==="shop"?"shop work":x.job.toLowerCase())+"."}});
    get("restk").forEach(x=>{if(x.v>=0.8)well.push(Math.round(x.v*100)+"% of what you worked went back to RESTK, at or above our 80% goal.");else{opp.push("Only "+Math.round(x.v*100)+"% of your pieces went back to RESTK. Our goal is 80%.");rt.quality=2;sup.push("We'll pair you with a lead tech on the repairs that are going to CLR or parts.")}});
    get("days").forEach(x=>{if(!x.miss){well.push("You worked every day you were scheduled ("+x.sd+" of "+x.sd+").");rt.attendance=x.sd>=15?4:3}else{opp.push(x.miss+" scheduled day"+(x.miss>1?"s":"")+" with no hours. We need you here when you're on the schedule.");rt.attendance=x.miss>=2?1:2;sup.push("If something is getting in the way of your schedule, tell us early. We'd rather fix it with you.");if(!goal)goal="Work every scheduled day next month."}});
    get("ot").forEach(x=>{if(x.ot>0)opp.push(hr2(x.ot)+" hours of overtime. We plan schedules to keep everyone at 40.")});
    get("drv").forEach(x=>{if(x.v==null)return;if(x.v>=97){well.push("You delivered "+x.v.toFixed(1)+"% of your stops.");rt.productivity=Math.max(rt.productivity,x.v>=98?4:3)}else{opp.push("You delivered "+x.v.toFixed(1)+"% of your stops. Our bonus tiers start at 95% and top out at 98%.");rt.productivity=x.v>=95?2:1;if(!goal)goal="Deliver 98% of your stops."}});
    get("drvon").forEach(x=>{if(x.v>=95)well.push(x.v.toFixed(0)+"% of your stops were on time.");else if(x.v<90){opp.push(x.v.toFixed(0)+"% of your stops were on time.");rt.attendance=Math.min(rt.attendance,2)}});
    get("issues").forEach(x=>{opp.push(x.c+" delivery issue"+(x.c>1?"s":"")+" (damage or problems at the door).");rt.quality=2;sup.push("We'll go over the issue reports together and walk through what to do differently.")});
    get("recog").forEach(x=>{well.push("You were recognized on the director walk "+x.c+(x.c===1?" time":" times")+".");rt.teamwork=x.c>=2?4:4});
  }else{
    get("ontime").forEach(x=>{if(x.ratio>=0.9){well.push("Your recap was in on time "+Math.round(x.ratio*100)+"% of the time.");rt.attendance=x.ratio>=0.98?4:3}else{opp.push("Your recap was on time "+Math.round(x.ratio*100)+"% of the time. It's due at the end of your shift.");rt.attendance=x.ratio>=0.7?2:1;if(!goal)goal="Every recap in by the end of your shift."}});

/* =====================================================================
   FLAGS THE DIRECTOR CLEARS, AND THE MORNING HUDDLE
   dcflags/{dc}_{date}_{hash}: every board flag becomes an item. It stays open until a manager or director
   picks a cause, writes the fix and clears it. The same flag 3 times in 14 days is sent to Frank.
   dchuddles/{dc}_{date}_{email}: the morning huddle. A logged huddle answers "huddle held" on the director walk.
   ===================================================================== */
const FLAG_CAUSES=["People","Process","Equipment","Volume","Other"];
const FLAG_REPEAT=3,FLAG_REPEAT_DAYS=14,FLAG_AGE_RED=2;
Object.assign(DEMO_STORE,{dcflags:"flags",dchuddles:"huddles"});
const hashStr=t=>{let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return (h>>>0).toString(36)};
const plain=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.replace(/\s+/g," ").trim()};
function flagParse(f,date){const html=f[1];const m=html.match(/^<b>([^<]+)<\/b>:\s*/);if(!m)return null;const head=m[1].trim();const dc=DCS.find(d=>head===d.name||head.startsWith(d.name+" "));if(!dc)return null;
  const area=head.slice(dc.name.length).trim()||"DC";const text=plain(html.slice(m[0].length));const norm=(area+"|"+text).toLowerCase().replace(/[$\d.,%]+/g,"#").slice(0,70);
  return {id:dc.code+"_"+date+"_"+hashStr(area+"|"+text),dc:dc.code,date,area,text,sev:f[0]==="w"?"w":"b",rkey:dc.code+"|"+hashStr(norm)}}
/* one open item per issue: if the same flag shows up again before it is cleared, it is the same item, seen again */
async function flagSync(flags,date){const out={};
  await Promise.all(flags.map(async f=>{const x=flagParse(f,date);if(!x)return;let same=[];try{same=await store.query([["rkey","EQUAL",x.rkey]],"dcflags")}catch(e){}
    const seenIn14=()=>new Set(same.flatMap(q=>q.seen||[q.date]).concat([date]).filter(d=>dayDiff(d,date)>=0&&dayDiff(d,date)<FLAG_REPEAT_DAYS)).size;
    let ex=same.find(q=>(q.seen||[q.date]).includes(date))||same.find(q=>q.status==="open"&&q.date<=date);
    if(ex){if(!(ex.seen||[]).includes(date)){ex.seen=Array.from(new Set((ex.seen||[ex.date]).concat([date]))).sort();ex.lastSeen=ex.seen[ex.seen.length-1];ex.text=x.text;ex.repeat=Math.max(ex.repeat||1,seenIn14());ex.escalated=ex.escalated||ex.repeat>=FLAG_REPEAT;try{await store.set("dcflags",ex.id,ex)}catch(e){}}}
    else{const rep=seenIn14();ex=Object.assign(x,{status:"open",raisedAt:new Date().toISOString(),seen:[date],lastSeen:date,repeat:rep,escalated:rep>=FLAG_REPEAT});try{await store.set("dcflags",x.id,ex)}catch(e){}}
    out[ex.id]=ex}));return out}
const flagAge=x=>Math.max(0,dayDiff(x.date,x.status==="cleared"?String(x.clearedAt||"").slice(0,10)||todayISO():todayISO()));
function flagRowHTML(x,canClear){const age=flagAge(x);
  return '<div class="flag" style="align-items:flex-start'+(x.status==="cleared"?';opacity:.65':'')+'"><span class="dot '+(x.sev==="w"?"w":"")+'" style="margin-top:6px"></span><div style="flex:1"><b>'+dcBy(x.dc).name+' '+esc(x.area)+'</b>: '+esc(x.text)+
   '<div class="muted" style="font-size:12px;margin-top:2px">'+md(x.date)+((x.seen||[]).length>1?' &middot; seen '+x.seen.length+' days, last '+md(x.lastSeen):'')+(x.status==="open"?' &middot; <b style="color:'+(age>=FLAG_AGE_RED?"var(--clay)":"var(--ink)")+'">open '+(age?age+' day'+(age>1?'s':''):'today')+'</b>':' &middot; cleared by '+esc(x.clearedByName||x.clearedBy||"")+' '+md(String(x.clearedAt).slice(0,10)))+(x.repeat>1?' &middot; <b style="color:var(--clay)">'+x.repeat+(x.repeat===2?'nd':x.repeat===3?'rd':'th')+' time in '+FLAG_REPEAT_DAYS+' days'+(x.escalated?', sent to Frank':'')+'</b>':'')+'</div>'+
   (x.status==="cleared"?'<div class="def" style="margin:4px 0 0"><b>'+esc(x.cause)+':</b> '+esc(x.fix)+'</div>':'')+'</div>'+(canClear&&x.status==="open"?'<button class="btn sm" data-clear="'+esc(x.id)+'">Review and clear</button>':(x.status==="cleared"?'<span class="pill p-ok">Cleared</span>':''))+'</div>'}
function clearFlagModal(x,after){let cause="";
  const m=modal('<h2>Review and clear</h2><div class="def"><b>'+dcBy(x.dc).name+' '+esc(x.area)+'</b> ('+md(x.date)+'): '+esc(x.text)+'</div>'+(x.repeat>1?'<div class="def" style="color:var(--clay)"><b>'+x.repeat+' times in '+FLAG_REPEAT_DAYS+' days.</b> Fix the cause, not just today.</div>':'')+

      Object.assign(x,{status:"cleared",cause,fix,photoId:pid,clearedBy:S.profile.email,clearedByName:S.profile.name||"",clearedAt:new Date().toISOString()});await store.set("dcflags",x.id,x);m.remove();toast("Cleared");after&&after()}catch(e){toast("Did not save: "+e.message)}}}
async function shrinkImg(f){const u=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});const img=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=u});

  // 3. goals for the day
  h+=sec(3,"Today's goals",'<div class="muted">'+(D.vol?"Started from the DC Scheduler's volume plan and the PPH goals.":"Started from the PPH goals and standards. The DC Scheduler volume plan fills these when it has today's numbers.")+' Change them to what the team commits to. The recaps check them at end of shift.</div>'+
    '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:8px">'+DAY_GOALS.map(g=>'<div><label class="lbl" style="margin-top:0">'+g.l+'</label><input class="in" data-goal="'+g.k+'" '+(g.time?'type="time"':'inputmode="'+(g.dec?"decimal":"numeric")+'"')+' value="'+esc(H.goals[g.k]||"")+'" placeholder="Not set" style="'+(big?"font-size:22px":"")+'">'+(H.gsrc&&H.gsrc[g.k]?'<div class="muted" style="font-size:11px">'+esc(H.gsrc[g.k])+'</div>':'')+(((D.std||{}).goals||{})[g.k]&&D.std.goals[g.k].limit?'<div class="muted" style="font-size:11px">'+(g.time?"No later than ":g.max?"No more than ":"No lower than ")+goalFmt(g,D.std.goals[g.k].limit)+(canManage(p)?" for supervisors":"")+'</div>':'')+'<div class="err" data-gerr="'+g.k+'" style="font-size:12px"></div>'+'</div>').join("")+'</div>'+
    '<label class="lbl">Today\'s focus</label><textarea class="in" id="h_focus" placeholder="3 trucks to Jax. Rewrap lanes cleared by noon.">'+esc(H.focus||"")+'</textarea>');
  h+=sec(4,"Safety",'<div style="font-size:'+(big?28:18)+'px;font-weight:700;color:var(--ink)">'+esc(safety)+'</div>');
  h+=sec(5,"Standard of the week",'<div class="muted">'+esc(std.dept)+'</div><div style="font-size:'+(big?28:18)+'px;font-weight:700;color:var(--ink)">'+esc(std.text)+'</div><div class="def">Every huddle this week covers it. Every director walk checks it.</div>');
  h+=sec(6,"Open flags and follow-ups",D.flags.length?D.flags.map(x=>'<div class="flag"><span class="dot '+(x.sev==="w"?"w":"")+'"></span><span><b>'+esc(x.area)+'</b>: '+esc(x.text)+' <span class="muted">('+md(x.date)+')</span></span></div>').join(""):'<div class="muted">Nothing open. Keep it that way.</div>');
  h+=sec(7,"Recognition",((pub.recog||[]).length?pub.recog.map(r=>'<div style="margin-top:4px"><b style="color:var(--ink)">'+esc(r.who)+'</b>: '+esc(r.what||"")+'</div>').join(""):'')+'<label class="lbl">Shout-out today</label><input class="in" id="h_shout" value="'+esc(H.shout||"")+'" placeholder="Who did it right and what they did">');
  h+=sec(8,"One ask for today",'<input class="in" id="h_ask" value="'+esc(H.ask||"")+'" placeholder="Every truck sealed and in stop order before it leaves">');
  h+='<div class="card"><button class="btn or wide" id="h_save">'+(H.at?"Update the huddle":"Huddle done")+'</button><div class="def">Saving it logs the huddle and today\'s goals. The director walk, the recaps and the board all use it.</div></div>';
  main.innerHTML=h;
  const keep=()=>{["focus","ask","shout","count"].forEach(k=>{const el=document.getElementById("h_"+k);if(el)H[k]=el.value});main.querySelectorAll("[data-goal]").forEach(i=>{const v=i.value.trim();if(v!==H.goals[i.dataset.goal]){H.goals[i.dataset.goal]=v;H.gsrc[i.dataset.goal]="Set by "+(p.name||"you").split(" ")[0]}})};
  main.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{const k=b.dataset.st;const i=HUD_ST.findIndex(s=>s[0]===(H.status[k]||""));const nx=HUD_ST[(i+1)%HUD_ST.length][0];if(nx)H.status[k]=nx;else delete H.status[k];
    const col={here:"var(--good)",late:"#9A5B12",out:"var(--clay)"}[nx]||"var(--line)";b.style.borderColor=col;b.style.borderWidth=nx?"2px":"";const l=b.querySelector("[data-stl]");if(l){l.textContent=HUD_ST.find(s=>s[0]===nx)[1];l.style.color=col}
    const c=tally(),t=document.getElementById("h_tally");if(t)t.innerHTML='<b>'+c.here+'</b> here &middot; <b>'+c.late+'</b> late &middot; <b style="color:var(--clay)">'+c.out+'</b> out &middot; '+c[""]+' not marked'+(pto.length?' &middot; PTO: '+pto.map(x=>esc(firstLast(x.name))).join(", "):'')});
  const hm=document.getElementById("h_mine"),ha=document.getElementById("h_all");if(hm)hm.onclick=()=>{keep();S.hAll=false;S._H=H;renderHuddle()};if(ha)ha.onclick=()=>{keep();S.hAll=true;S._H=H;renderHuddle()};
  document.getElementById("hbig").onclick=()=>{keep();S._H=H;S.hbig=!S.hbig;renderHuddle()};document.getElementById("hback").onclick=()=>{S.view="file";render()};
  const limitErr=()=>{let bad=false;if(canManage(p))return false;DAY_GOALS.forEach(g=>{const L=((D.std||{}).goals||{})[g.k];const e=main.querySelector('[data-gerr="'+g.k+'"]');const v=H.goals[g.k];const off=L&&L.limit&&v!==""&&worseThan(g,v,L.limit);if(e)e.textContent=off?(g.time?"Can't be later than ":g.max?"Can't be more than ":"Can't be lower than ")+goalFmt(g,L.limit)+". Ask your manager.":"";if(off)bad=true});return bad};
  main.querySelectorAll("[data-goal]").forEach(i=>i.onchange=()=>{keep();limitErr()});
  document.getElementById("h_save").onclick=async()=>{keep();if(limitErr())return toast("One of today's goals is past the limit your manager set");const c=tally();const outs=scope.filter(x=>H.status[x.id]==="out").map(x=>firstLast(x.name)),lates=scope.filter(x=>H.status[x.id]==="late").map(x=>firstLast(x.name));
    Object.assign(H,{present:scope.filter(x=>["here","late"].includes(H.status[x.id])).map(x=>x.id),outs,lates,count:H.count||String(c.here+c.late||""),crew:scope.length,safety,standard:std.text,at:new Date().toISOString(),leader:p.name||p.email});
    try{await store.set("dchuddles",id,H);S._H=null;toast("Huddle logged. Go get it.");S.view="file";render()}catch(e){toast("Did not save: "+e.message)}}}


(async function boot(){
  if(DEMO){const em=ls("demo_email");if(em&&ls("demo_name")){S.profile=await loadProfile(em);if(S.profile.role!=="team")S.profile.name=ls("demo_name")}}
  else if(auth.s&&auth.s.verified){try{await auth.token();S.profile=await loadProfile(auth.s.email)}catch(e){}}
  render();
})();
</script>
</body>
